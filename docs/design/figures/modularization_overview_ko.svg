<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1130" viewBox="0 0 1680 1130" role="img"><title>MMP 모듈화: 기존 구조와 현재 구조</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563d9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#198363"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d899b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7350b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b06c20"/></marker></defs><rect x="0" y="0" width="1680" height="1130" rx="0" fill="#f6f8fc" stroke="#f6f8fc" stroke-width="2"/><text x="55" y="68" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="42" font-weight="700" text-anchor="start">MMP, 이렇게 정리됐습니다</text><text x="55" y="112" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" text-anchor="start">기존 알고리즘은 유지하면서, 호출 입구와 교체 가능한 경계를 만들었습니다.</text><rect x="55" y="155" width="740" height="815" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/><rect x="885" y="155" width="740" height="815" rx="18" fill="#ffffff" stroke="#2563d9" stroke-width="2.5"/><rect x="82" y="180" width="118" height="34" rx="17" fill="#f0f3f7" stroke="#f0f3f7" stroke-width="2"/><text x="141.0" y="204" fill="#7d899b" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="700" text-anchor="middle">기존</text><rect x="912" y="180" width="118" height="34" rx="17" fill="#edf4ff" stroke="#edf4ff" stroke-width="2"/><text x="971.0" y="204" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="700" text-anchor="middle">현재</text><text x="223" y="205" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" text-anchor="start">ROS 실행 쪽에서 계획 단계를 직접 조율</text><text x="1053" y="205" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" text-anchor="start">계획은 라이브러리 입구로 호출</text><path d="M425,379 L425,410 L247,410 L247,447" fill="none" stroke="#7d899b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey)"/><path d="M425,410 L602,410 L602,447" fill="none" stroke="#7d899b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey)"/><path d="M247,557 L247,627" fill="none" stroke="#7d899b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey)"/><path d="M602,557 L602,627" fill="none" stroke="#7d899b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey)"/><path d="M445,502 L405,502" fill="none" stroke="#7d899b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#grey)"/><rect x="90" y="242" width="670" height="137" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><text x="425" y="291" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ReplanFSM / ROS 실행</text><text x="425" y="335" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">콜백·실행 관리 + 계획 분기·입출력 조율</text><rect x="90" y="447" width="315" height="110" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><rect x="445" y="447" width="315" height="110" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><text x="247" y="490" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">PathManager</text><text x="247" y="529" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">탐색·환경·최적화 연결</text><text x="602" y="491" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="700" text-anchor="middle">SegmentChainPlanner</text><text x="602" y="529" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">구간 계획·평가</text><rect x="90" y="627" width="670" height="145" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><text x="425" y="681" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" text-anchor="middle">PolyTrajOptimizer</text><text x="425" y="728" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="400" text-anchor="middle">MINCO · L-BFGS 최적화</text><rect x="90" y="820" width="670" height="108" rx="18" fill="#fff8ed" stroke="#efdcbb" stroke-width="2"/><text x="425" y="863" fill="#b06c20" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="400" text-anchor="middle">설정·지형·기체 제약·평가가</text><text x="425" y="896" fill="#b06c20" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="400" text-anchor="middle">ROS와 여러 계획 클래스에 직접 연결</text><path d="M815,542 L865,542" fill="none" stroke="#2563d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="920" y="242" width="670" height="83" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><text x="1255" y="294" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">외부 C++ 앱  /  기존 ReplanFSM</text><path d="M1255,325 L1255,364" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="920" y="364" width="670" height="104" rx="18" fill="#edf4ff" stroke="#2563d9"