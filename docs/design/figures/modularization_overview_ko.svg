" font-size="20" font-weight="400" text-anchor="middle">탐색 구현 교체</text><path d="M1077,697 L1077,649" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M1432,697 L1432,649" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><rect x="920" y="821" width="670" height="107" rx="18" fill="#f3effb" stroke="#b7a4d9" stroke-width="2"/><text x="1255" y="861" fill="#7350b8" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="700" text-anchor="middle">PolyTrajOptimizer::solve</text><text x="1255" y="901" fill="#7350b8" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">MINCO · L-BFGS는 통째로 유지</text><rect x="55" y="999" width="1570" height="77" rx="18" fill="#edf4ff" stroke="#edf4ff" stroke-width="2"/><text x="840" y="1048" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="700" text-anchor="middle">설정·환경 준비  →  plan() 한 번 호출  →  상태·소유 궤적·평가 반환</text><text x="840" y="1110" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">ROS/RViz · Python 지형 로더 · 병렬 계획 · 3-pass 유지  |  개념 비교도</text></svg>