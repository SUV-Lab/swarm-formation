<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1635" viewBox="0 0 1760 1635" role="img"><title>MMP 현재 라이브러리 호출과 교체 경계</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563d9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#198363"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d899b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7350b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b06c20"/></marker></defs><rect x="0" y="0" width="1760" height="1635" rx="0" fill="#f6f8fc" stroke="#f6f8fc" stroke-width="2"/><text x="50" y="66" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="41" font-weight="700" text-anchor="start">현재 코드의 라이브러리 호출 구조</text><text x="50" y="107" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="400" text-anchor="start">설정·환경은 초기화 입력입니다. 임무마다 plan(request)를 호출하고 결과를 돌려받습니다.</text><rect x="50" y="140" width="530" height="131" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="315" y="184" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">PlanSettings</text><text x="315" y="226" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">기존 설정값 + 모델·탐색 구현 주입</text><text x="315" y="254" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">초기 준비</text><rect x="615" y="140" width="530" height="131" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="880" y="184" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">PlanningEnvironment</text><text x="880" y="226" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">지형 · 위험영역 · 장애물 (소유 값)</text><text x="880" y="254" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">초기 준비</text><rect x="1180" y="140" width="530" height="131" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="1445" y="184" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">MissionPlanRequest</text><text x="1445" y="226" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">시작 상태 · 경유점 · 끝 경계조건</text><text x="1445" y="254" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">임무마다 전달</text><path d="M315,271 L315,296 L665,296 L665,325" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M880,271 L880,325" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M1445,271 L1445,301 L1210,301 L1210,325" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="50" y="326" width="330" height="1099" rx="18" fill="#f0f3f7" stroke="#d7e0ea" stroke-width="2"/><text x="215" y="366" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">기존 ROS 프로그램</text><rect x="70" y="401" width="290" height="213" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="215" y="445" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ReplanFSM</text><text x="215" y="487" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="22" font-weight="400" text-anchor="middle">임무 콜백 수신</text><text x="215" y="526" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="22" font-weight="400" text-anchor="middle">계획 호출 · 결과 채택</text><text x="215" y="565" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="22" font-weight="400" text-anchor="middle">RViz / 토픽 연결</text><rect x="70" y="771" width="290" height="172" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="215" y="817" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Python 지형 로더</text><text x="215" y="859" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">기존 GridMap 수신</text><text x="215" y="895" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">현재 좌표·단위 유지</text><rect x="70" y="1130" width="290" height="241" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="215" y="1177" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">실행 연결 유지</text><text x="215" y="1220" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">궤적 발행 · 실행 상태</text><text x="215" y="1255" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">ABORT · 재계획</text><text x="215" y="1290" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">같은 PathManager 사용</text><text x="215" y="1350" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">executionManager() 별칭</text><rect x="430" y="325" width="990" height="123" rx="18" fill="#edf4ff" stroke="#2563d9" stroke-width="2.5"/><text x="925" y="369" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" text-anchor="middle">MissionPlanner — ROS 타입 없는 공개 API</text><text x="925" y="416" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="32" font-weight="700" text-anchor="middle">result = planner.plan(request)</text><path d="M360,455 L396,455 L396,392 L430,392" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="398" y="480" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle">호출</text><rect x="410" y="492" width="1030" height="933" rx="18" fill="#fff8ee" stroke="#d9b785" stroke-width="2" stroke-dasharray="11 7"/><text x="435" y="528" fill="#b06c20" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="700" text-anchor="start">현재 실제 구현  ·  내부 ROS 연결 유지</text><path d="M925,448 L925,553" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="430" y="553" width="990" height="151" rx="18" fill="white" stroke="#d9b785" stroke-width="2"/><text x="925" y="590" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" text-anchor="middle">RosPlanningBackend (MissionPlanningBackend 구현)</text><text x="925" y="632" fill="#b06c20" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">직접 계획  또는  SegmentChainPlanner의 구간 계획</text><text x="925" y="676" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">PathManager: 탐색·환경·optimizer 생성·실행 저장소 연결</text><path d="M360,848 L398,848 L398,667 L430,667" fill="none" stroke="#7d899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#grey)"/><path d="M730,704 L730,751" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="430" y="751" width="600" height="135" rx="18" fill="#edf4ff" stroke="#a9c3f0" stroke-width="2"/><text x="730" y="791" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">분리한 계산 함수들</text><text x="730" y="832" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">경로 정리 · 구간 경계 · 비용 프로필</text><text x="730" y="867" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">기존 계산을 함수 단위로 재사용</text><rect x="1090" y="751" width="310" height="164" rx="18" fill="#edf9f3" stroke="#92cbb6" stroke-width="2"/><text x="1245" y="791" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" text-anchor="middle">RouteSearchBackend</text><text x="1245" y="830" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" text-anchor="middle">기본: FM2 / A*</text><text x="1245" y="866" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">다른 탐색 구현으로 교체</text><text x="1245" y="896" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="400" text-anchor="middle">경로 + 위험구역 정책 반환</text><path d="M1090,817 L1030,817" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M730,886 L730,953" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="754" y="930" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="start">경로·경계조건 전달</text><rect x="430" y="953" width="990" height="243" rx="18" fill="#f3effb" stroke="#aa93d0" stroke-width="2.5"/><text x="925" y="998" fill="#7350b8" font-family="Noto Sans CJK KR, sans-serif" font-size="33" font-weight="700" text-anchor="middle">PolyTrajOptimizer::solve(request)</text><rect x="466" y="1027" width="918" height="102" rx="14" fill="#7856b7" stroke="#7856b7" stroke-width="2"/><text x="925" y="1069" fill="white" font-family="Noto Sans CJK KR, sans-serif" font-size="35" font-weight="700" text-anchor="middle">MINCO  +  L-BFGS</text><text x="925" y="1110" fill="white" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="400" text-anchor="middle">내부를 더 분해하지 않고 한 단위로 유지</text><text x="925" y="1170" fill="#7350b8" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">seed · 최종 궤적 · 최적화 감사 결과</text><rect x="1480" y="553" width="230" height="642" rx="18" fill="#edf9f3" stroke="#92cbb6" stroke-width="2"/><text x="1595" y="596" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">VehicleModel</text><text x="1595" y="633" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="700" text-anchor="middle">명시 주입 시 같은 객체</text><text x="1595" y="668" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">기본: FixedWingModel</text><text x="1595" y="713" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="400" text-anchor="middle">기하 제약</text><text x="1595" y="740" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">시작·끝 상태 판정</text><text x="1595" y="805" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="400" text-anchor="middle">전단 탐색의</text><text x="1595" y="832" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">물리 제약</text><text x="1595" y="1053" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="400" text-anchor="middle">최적화 비용·미분</text><text x="1595" y="1080" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">optimizer 감사</text><text x="1595" y="1143" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="400" text-anchor="middle">구간 조립 이후</text><text x="1595" y="1170" fill="#198363" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="middle">전체 비행 평가 (chain)</text><path d="M1480,724 L1455,724 L1455,648 L1420,648" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M1480,816 L1400,816" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M1480,1064 L1420,1064" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M1480,1154 L1457,1154 L1457,1320 L1420,1320" fill="none" stroke="#198363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M925,1196 L925,1255" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="430" y="1255" width="990" height="129" rx="18" fill="white" stroke="#d9b785" stroke-width="2"/><text x="925" y="1296" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">구간 결과 조립 · phase 구성 · 평가</text><text x="925" y="1334" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="22" font-weight="400" text-anchor="middle">구간 계획: 기존 병렬 실행·재시도·연결 규칙 유지</text><text x="925" y="1367" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">전체 비행 평가는 chain 경로 / 직접 계획은 optimizer 감사 사용</text><path d="M925,1384 L925,1472" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="430" y="1472" width="990" height="120" rx="18" fill="#edf4ff" stroke="#2563d9" stroke-width="2.5"/><text x="925" y="1511" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" text-anchor="middle">MissionPlanResult</text><text x="925" y="1547" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="23" font-weight="400" text-anchor="middle">상태·실패 사유  |  최종/참고 궤적  |  phase·평가</text><text x="925" y="1578" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">값 소유: planner 파괴·다음 계획에도 결과 유지</text><path d="M430,1530 L215,1530 L215,1371" fill="none" stroke="#2563d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="215" y="1472" fill="#2563d9" font-family="Noto Sans CJK KR, sans-serif" font-size="21" font-weight="400" text-anchor="middle">반환 결과 채택</text><rect x="1480" y="1280" width="230" height="210" rx="18" fill="white" stroke="#d7e0ea" stroke-width="2"/><text x="1595" y="1324" fill="#18273d" font-family="Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">외부 C++ 앱</text><text x="1595" y="1365" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">FSM 없이도</text><text x="1595" y="1397" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">같은 plan() 호출</text><text x="1595" y="1429" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">ROS context와</text><text x="1595" y="1461" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="middle">명시 backend 사용</text><path d="M1510,1535 L1557,1535" fill="none" stroke="#2563d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1580" y="1542" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="start">호출·데이터</text><path d="M1510,1580 L1557,1580" fill="none" stroke="#198363" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><text x="1580" y="1587" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" text-anchor="start">주입·공유</text><text x="50" y="1615" fill="#526276" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="400" text-anchor="start">ROS 제거·새 VTOL 전환 법칙·지형 로더 C++ 이식은 후속 범위  |  호출과 책임 관계를 요약한 그림</text></svg>