/**:
  ros__parameters:
    # ============================================================
    # Format: [center_x, center_y, center_z, reach, peak] x N
    #  - all coords/reach in FRAME UNITS (1 unit = 100 m)
    #  - reach: vertical-cylinder radius; quadratic moat
    #           moat = peak * (1 - d_horizontal/reach)^2, zero outside;
    #           z-flat within |z - center_z| < reach, zero above/below.
    #  - peak: MUST be in (0, 1]. Values > 1 saturate against the
    #          1-1e-3 cap over most of the zone, flattening the moat
    #          into a gradient-free disc (avoidance shaping is lost;
    #          only the barrier still acts). The pre-V3 Gaussian
    #          format used peak=100 "risk levels" — do not copy those.
    #
    # NOTE: this file is NOT loaded by path_manager.launch.py — zones
    # normally arrive at runtime via /risk_zones/load (RViz
    # ObstacleScenarioPanel, see mmp_terrain/data/scenarios/obstacles).
    # Kept only as a hand-loadable example with V3-correct values.
    # ============================================================

    risk_zones: [
      # restricted zone Site 1
      25.0, 0.0, 0.0, 15.0, 0.9,

      # restricted zone Site 2
      40.0, -5.0, 0.0, 20.0, 0.9,

      40.0, 10.0, 10.0, 10.0, 0.9
    ]
