/**:
  ros__parameters:
    # Legacy risk field example; not loaded by launch automatically.
    # Entries: [center_x, center_y, center_z, reach, peak].
    # Coordinates and reach use frame units (100 m); peak must be in (0, 1].
    manager/risk_model_mode: legacy

    risk_zones: [
      # restricted zone Site 1
      25.0, 0.0, 0.0, 15.0, 0.9,

      # restricted zone Site 2
      40.0, -5.0, 0.0, 20.0, 0.9,

      40.0, 10.0, 10.0, 10.0, 0.9
    ]
