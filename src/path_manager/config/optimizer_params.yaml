/**:
  ros__parameters:
    # ================= Pipeline: FM2 -> shortcut -> MINCO -> L-BFGS =================

    # ---- Front-end (FM2 / A*) ----
    manager/front_end: fm2              # fm2 | astar(ablation baseline)
    manager/fm2_coarse_k: 1             # eikonal grid downsample; lower = finer/slower
    manager/fm2_max_cells: 1640000000   # OOM guard; over this -> straight-line fallback
    manager/risk_weight: 30.0           # alpha: moat cost scale (tie-break when forced into a zone)
    manager/risk_barrier: 100.0         # finite wall added inside non-exempt zones; 0 = off
    manager/risk_smha_w: 2.0            # SMHA* suboptimality bound (astar front-end only)

    # Altitude band: wave slowed outside [min,max](start_z,goal_z); 0 = off.
    manager/fm2_alt_penalty: 2.0
    manager/fm2_alt_zscale: 10.0        # up ramp; keep >=10 (5 deadlocks the extraction at walls)
    manager/fm2_alt_zscale_down: 2.0    # down ramp (stiff: never dive below mission alt)

    # ---- Clearances (frame units: 1 ~ 100 m horizontal / 44 m vertical) ----
    manager/obstacle_clearance: 1.0     # front-end blocked threshold (route-to-terrain distance)
    manager/dyn_obstacle_margin: 10.0   # wider berth around RUNTIME obstacles only; <= clearance disables
    optimization/obstacle_clearance: 0.5  # optimizer penalty onset; MUST be < manager/obstacle_clearance
                                          # (equal -> path sits on the penalty edge and can't be smoothed)

    # ---- Shortcut / MINCO input ----
    manager/astar_bypass_shortcut: false  # true = raw front-end path straight to MINCO (debug)
    manager/length_per_piece: 50.0      # piece scale; segments subdivided to max 4x this
    manager/astar_step_size: 1.0        # A* raw path spacing, frame units (astar front-end)

    # ---- Optimizer weights ----
    optimization/constrain_points_perPiece: 200
    optimization/weight_obstacle: 10000.0
    optimization/weight_swarm: 0.0
    optimization/weight_feasibility: 10000.0
    optimization/weight_sqrvariance: 10000.0
    optimization/weight_time: 500.0     # too low -> duration blow-up (loops/loitering knots)
    optimization/weight_formation: 0.0
    optimization/weight_Risk: 10000.0  # arc-length integral of the FM2-shared OR-moat field:
                                       # wei * ∫ r(p)*||v|| dt, same r as manager/risk_weight consumes.
                                       # Layer-agreement scale: ~ risk_weight * weight_time / cruise
                                       # speed (30*500/2 = 7500); 10000 keeps risk slightly stiffer.
    optimization/weight_Risk_barrier: 25000.0  # smoothed front-end barrier K on NON-exempt zones
                                       # (start/goal-inside zones stay moat-only, same rule as FM2).
                                       # Derivation: K * weight_time / cruise = 100*500/2. Without it
                                       # MINCO re-litigates the rim standoff: the moat's zero contact
                                       # slope makes skirt-cutting profitable ~tens of metres deep.
    optimization/weight_altitude: 200.0  # z-cap above mission band (quadratic); keep << weight_obstacle or it presses into terrain
    optimization/swarm_clearance: 0.5
    optimization/formation_type: 2

    # ---- Dynamics (units/s, units/s^2; 1 unit = 100 m horizontal) ----
    # Corner radius ~ v^2/a: with 2.0/5.0 turns are tight; lower max_acc for wider arcs.
    optimization/max_vel: 2.0
    optimization/max_acc: 5.0
    manager/max_vel: 2.0
    manager/max_acc: 5.0

    # Initial-velocity lead-in horizon (seconds). On an in-flight replan, plant a
    # short path point along start_vel so the min-jerk head piece coasts out in the
    # direction the drone is already moving instead of overshooting toward a far
    # first waypoint. d_lead = |start_vel| * this. 0.0 = legacy (no lead-in).
    # Toggle/tune here for A/B without rebuild.
    optimization/lead_in_time: 0.0   # dormant on main: enable after lead-in validation

    # ---- Map / SDF ----
    manager/sdf_voxel_size: 1.0
    manager/ground_height: -0.01        # <= -0.5 disables
    manager/virtual_ceil_height: -1.0   # <= -0.5 disables
    manager/world: "dokdo"              # fallback; RViz MapSelector overrides
    manager/esdf_dir: "src/mmp_terrain/data"
    manager/save_terrain_esdf: ""       # override path; empty = <esdf_dir>/<world>.esdf
    manager/load_terrain_esdf: ""
    manager/dynamic_obstacle_radius: 50.0  # RViz "Publish Point" sphere radius, FRAME units (50 = 5 km; use 0.5 for 50 m)
    manager/esdf_viz_step: 4.0             # ESDF occupancy overlay sample step [m]; 1.0 = fine but ~30 s per (re)load
    manager/esdf_viz_enable: true          # false = skip the overlay entirely (fastest planning)

    # ---- Logging ----
    enable_obstacles: true
    enable_debug_logs: true
    enable_lbfgs_detail_logs: true
